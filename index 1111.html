<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Snake</title>
<style>
  :root { --bg:#2a1233; --board:#3a1a47; --ink:#ffe9f3; --accent:#ff7eb6; --gold:#ffd166; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background: radial-gradient(circle at 50% 0%, #4b1f5c, var(--bg) 70%);
         color:var(--ink); font-family:"Trebuchet MS", Verdana, sans-serif; display:flex; flex-direction:column;
         align-items:center; gap:12px; padding:16px; touch-action:manipulation; }
  h1 { margin:0; font-size:clamp(1.5rem,6vw,2.3rem); text-align:center; }
  .scores { display:flex; gap:22px; font-size:1.05rem; align-items:center; }
  .scores b { color:var(--gold); }
  .wrap { position:relative; width:min(92vw,440px); }
  canvas { width:100%; aspect-ratio:1/1; display:block; border-radius:14px; background:var(--board);
           box-shadow:0 0 30px rgba(255,126,182,.25); }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:12px; background:rgba(42,18,51,.88); border-radius:14px; text-align:center; padding:20px; }
  #overlay.hidden { display:none; }
  #banner { position:absolute; left:0; right:0; top:10px; text-align:center; font-size:1.2rem; color:var(--gold);
            text-shadow:0 2px 8px #000; opacity:0; transition:opacity .3s; pointer-events:none; }
  #banner.show { opacity:1; }
  input { font:inherit; padding:10px 16px; border-radius:999px; border:2px solid var(--accent); background:#1f0c28;
          color:var(--ink); text-align:center; width:min(70vw,240px); }
  button { font:inherit; color:#2a1233; background:var(--accent); border:0; border-radius:999px; padding:10px 22px; cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,56px); gap:8px; }
  .pad button { padding:0; font-size:1.4rem; background:#5a2a6e; color:var(--ink); border-radius:12px; }
  .up { grid-column:2; } .left { grid-column:1; grid-row:2; } .down { grid-column:2; grid-row:2; } .right { grid-column:3; grid-row:2; }
  .hint { margin:0; font-size:.85rem; opacity:.75; text-align:center; }
  #mute { background:transparent; color:var(--ink); border:1px solid #7a4a8e; padding:4px 12px; }
</style>
</head>
<body>
  <h1 id="heading">Love Snake</h1>
  <div class="scores">
    <span>Hearts <b id="score">0</b></span><span>Length <b id="len">3</b></span><span>Best <b id="best">0</b></span>
    <button id="mute" aria-pressed="false">Sound on</button>
  </div>
  <div class="wrap">
    <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
    <div id="banner"></div>
    <div id="overlay">
      <div id="title" style="font-size:1.5rem">Who is playing?</div>
      <input id="name" maxlength="16" placeholder="Her name" aria-label="Player name">
      <button id="start">Play</button>
    </div>
  </div>
  <div class="pad" aria-label="On-screen controls">
    <button class="up" data-dir="up" aria-label="Up">&#9650;</button>
    <button class="left" data-dir="left" aria-label="Left">&#9664;</button>
    <button class="down" data-dir="down" aria-label="Down">&#9660;</button>
    <button class="right" data-dir="right" aria-label="Right">&#9654;</button>
  </div>
  <p class="hint">Eat the hearts and watch her grow. Every 3 hearts starts a bonus with a love note: hearts count double. You can pass through the walls. Don't bite your own tail!<br>Arrow keys or WASD, space to pause, swipe on a phone.</p>

<script>
const canvas = document.getElementById("board"), ctx = canvas.getContext("2d");
const N = 20, CELL = canvas.width / N;
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const OPP = { up:"down", down:"up", left:"right", right:"left" };
const FOODS = ["#ff2e63", "#ff5c8a", "#ff8fab", "#e6195a", "#ff6b9d"];   // heart colours
const $ = id => document.getElementById(id);
const music = new Audio("music.mp3"); music.loop = true; music.volume = 0.35;   // optional: put a song called music.mp3 in the same folder

// Love notes shown in the background at each bonus. Edit these, add more, or delete some.
const LOVE_NOTES = [
  "Honest loves Ritah and will marry her one day",
  "Come closer, I like the way you move",
  "You are driving me crazy tonight",
  "Wish I was there with you right now",
  "Keep going, I can't take my eyes off you",
  "You look so good it should be illegal"
];
// Special messages for milestones: the number is how many hearts she has eaten.
const MILESTONE_NOTES = {
  10: "My heart races for you, Ritah. I am coming to hold you, my love"
};
const BONUS_EVERY = 3;   // a bonus starts after this many hearts
const BONUS_LENGTH = 60;
let bonusNote = LOVE_NOTES[0], bonusTotal = BONUS_LENGTH, moody = false;   // moody = the warm, slow mood after the first bonus
const TEN_NOTE = "I am coming to steal all your kisses tonight, babe";   // special message when she reaches 10 points
let tenShown = false;
let snake, dir, nextDir, food, score, bulges, particles, floaters, eaten = 0, bonusSteps = 0;
let running = false, paused = false, lastStep = 0, stepMs = 150, best = 0, name = "", muted = false, audio = null;
try { best = +localStorage.getItem("loveSnakeBest") || 0; } catch (e) {}
$("best").textContent = best;

function beep(freq, dur, type) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || "sine"; o.frequency.value = freq; g.gain.value = 0.08;
    o.connect(g); g.connect(audio.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur); o.stop(audio.currentTime + dur);
  } catch (e) {}
}

function banner(text) {
  const b = $("banner"); b.textContent = text; b.classList.add("show");
  clearTimeout(banner.t); banner.t = setTimeout(() => b.classList.remove("show"), 1800);
}

function placeFood() {
  do { food = { x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N), c: FOODS[Math.floor(Math.random()*FOODS.length)] }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = "right"; score = 0; bulges = []; particles = []; floaters = []; stepMs = 150; eaten = 0; bonusSteps = 0; tenShown = false; moody = false; clearInterval(grooveTimer);
  $("score").textContent = 0; $("len").textContent = snake.length; placeFood();
}

function start() {
  name = $("name").value.trim();
  $("heading").textContent = name ? "Love Snake for " + name : "Love Snake";
  reset(); running = true; paused = false; $("overlay").classList.add("hidden"); lastStep = performance.now();
  beep(520, .12); music.play().catch(() => {}); 
}

function turn(d) { if (d !== OPP[dir]) nextDir = d; }

function step() {
  if (bonusSteps > 0) bonusSteps--;
  const tl = snake[snake.length - 1];
  if (Math.random() < 0.3) particles.push({ x:tl.x * CELL + CELL / 2, y:tl.y * CELL + CELL / 2, vx:Math.random() - .5, vy:-1.6, life:.8, e:"\uD83D\uDC95" });
  dir = nextDir;
  const h = snake[0], [dx, dy] = DIRS[dir];
  const head = { x:(h.x+dx+N)%N, y:(h.y+dy+N)%N };
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  bulges = bulges.map(i => i + 1);
  if (head.x === food.x && head.y === food.y) {
    const pts = bonusSteps > 0 ? 2 : 1; score += pts; eaten++; $("score").textContent = score; bulges.push(0);
    for (let i = 0; i < 12; i++) particles.push({ x:head.x*CELL+CELL/2, y:head.y*CELL+CELL/2,
      vx:(Math.random()-.5)*5, vy:(Math.random()-.5)*5 - 1, life:1, e:i%3 ? "\u2728" : "\uD83D\uDC96" });
    floaters.push({ x:head.x*CELL+CELL/2, y:head.y*CELL, life:1, t:"+" + pts });
    beep(660 + Math.min(score,15)*25, .15, "triangle");
    if (eaten % BONUS_EVERY === 0 || MILESTONE_NOTES[eaten]) {
      bonusNote = MILESTONE_NOTES[eaten] || LOVE_NOTES[(Math.floor(eaten / BONUS_EVERY) - 1) % LOVE_NOTES.length];
      moody = moody || eaten > BONUS_EVERY;
      bonusTotal = MILESTONE_NOTES[eaten] ? 100 : (moody ? 80 : BONUS_LENGTH); bonusSteps = bonusTotal;
      fireworks(); if (moody) startGroove(); else chime(); if (MILESTONE_NOTES[eaten]) setTimeout(fireworks, 500);
      banner("BONUS! Hearts count double" + (name ? ", " + name : "") + "!"); beep(880, .3, "square");
    }
    if (score >= 10 && !tenShown) {
      tenShown = true; moody = true; bonusTotal = 80; bonusSteps = bonusTotal; bonusNote = TEN_NOTE; fireworks(); startGroove();
      banner("A special message for you" + (name ? ", " + name : "") + "!");
    }
    placeFood(); stepMs = Math.max(70, 150 - score*3);
  }
  const tailIdx = snake.length - 1, hit = bulges.indexOf(tailIdx);
  if (hit !== -1) { bulges.splice(hit, 1); $("len").textContent = snake.length; }   // bulge reached the tail: she grows
  else snake.pop();
}

function gameOver() {
  running = false; beep(200, .4, "sawtooth");
  if (score > best) { best = score; $("best").textContent = best; try { localStorage.setItem("loveSnakeBest", best); } catch (e) {} }
  $("title").textContent = "Oops! " + score + " hearts" + (name ? ", " + name : "") + ". Again?";
  $("name").style.display = "none"; $("start").textContent = "Play again"; $("overlay").classList.remove("hidden");
}

function seg(i) { return { x: snake[i].x*CELL + CELL/2, y: snake[i].y*CELL + CELL/2 }; }
function radius(i) {
  let r = CELL * 0.46 * (1 - 0.4 * i / snake.length);
  bulges.forEach(b => { r += CELL * 0.32 * Math.max(0, 1 - Math.abs(i - b) / 2); });
  return r;
}

function drawHeart(cx, cy, s, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.9);
  ctx.bezierCurveTo(cx - s * 1.4, cy - s * 0.1, cx - s * 0.7, cy - s * 1.1, cx, cy - s * 0.4);
  ctx.bezierCurveTo(cx + s * 0.7, cy - s * 1.1, cx + s * 1.4, cy - s * 0.1, cx, cy + s * 0.9);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.beginPath();
  ctx.ellipse(cx - s * 0.5, cy - s * 0.3, s * 0.18, s * 0.28, -0.6, 0, Math.PI * 2); ctx.fill();
}

let grooveTimer = null, grooveStep = 0;
function soft(freq, dur, type, vol) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audio.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur); o.stop(audio.currentTime + dur);
  } catch (e) {}
}
function startGroove() {                         // slow bass and warm chords while a warm bonus is on
  clearInterval(grooveTimer); grooveStep = 0;
  grooveTimer = setInterval(() => {
    if (!running || bonusSteps <= 0) { clearInterval(grooveTimer); return; }
    if (paused) return;
    const bass = [110, 0, 110, 0, 130.8, 0, 98, 0][grooveStep % 8];
    if (bass) soft(bass, .7, "triangle", .12);
    if (grooveStep % 4 === 0) [220, 261.6, 329.6, 392].forEach(f => soft(f, 2.4, "sine", .035));
    grooveStep++;
  }, 650);
}

function wrapLines(text, maxW) {
  const words = text.split(" "), lines = []; let cur = "";
  words.forEach(w => {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  });
  lines.push(cur); return lines;
}

function fireworks() {
  for (let b = 0; b < 4; b++) {
    const cx = 60 + Math.random() * 280, cy = 60 + Math.random() * 200;
    for (let i = 0; i < 14; i++) {
      const a = Math.PI * 2 * i / 14, sp = 2 + Math.random() * 2;
      particles.push({ x:cx, y:cy, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, life:1.3, e: i % 2 ? "\uD83D\uDC97" : "\u2728" });
    }
  }
}

function chime() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .35), i * 120)); }

const ambient = Array.from({ length: 14 }, (_, i) => ({ x:Math.random() * 400, y:Math.random() * 400, s:5 + Math.random() * 6, v:.15 + Math.random() * .3, ph:Math.random() * 6 }));
function drawAmbient(ts) {                      // soft hearts always drifting up behind the game
  ambient.forEach(a => {
    a.y -= a.v; if (a.y < -20) { a.y = 420; a.x = Math.random() * 400; }
    ctx.globalAlpha = 0.16; drawHeart(a.x + Math.sin(ts / 900 + a.ph) * 10, a.y, a.s, "#ff8fab");
  });
  ctx.globalAlpha = 1;
}

function drawBonus(ts) {
  if (bonusSteps <= 0) return;
  const fade = Math.min(1, bonusSteps / 8);          // fades out at the end of the bonus
  const g = ctx.createRadialGradient(200, 200, 20, 200, 200, 280);
  g.addColorStop(0, (moody ? "rgba(220,40,110," : "rgba(255,209,102,") + (moody ? 0.5 : 0.35) * fade + ")");
  g.addColorStop(1, (moody ? "rgba(50,0,50," : "rgba(255,46,99,") + (moody ? 0.5 : 0.18) * fade + ")");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 400);
  for (let i = 0; i < 6; i++) {                       // hearts drifting up behind the snake
    ctx.globalAlpha = 0.45 * fade;
    drawHeart(40 + i * 64, 420 - ((ts / 18 + i * 75) % 460), 9, "#ff8fab");
  }
  ctx.save();
  ctx.globalAlpha = (0.55 + Math.sin(ts / 250) * 0.15) * fade;
  ctx.fillStyle = "#ffe9f3"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 30px Trebuchet MS"; ctx.shadowColor = "#ff2e63"; ctx.shadowBlur = 18;
  const lines = wrapLines(bonusNote, 330);
  lines.forEach((line, i) => ctx.fillText(line, 200, 200 - (lines.length - 1) * 20 + i * 40));
  ctx.restore();
  ctx.globalAlpha = 1; ctx.fillStyle = "#ffd166"; ctx.fillRect(0, 0, 400 * bonusSteps / bonusTotal, 5);   // time left
}

function draw(ts) {
  ctx.fillStyle = "#3a1a47"; ctx.fillRect(0, 0, 400, 400);
  ctx.fillStyle = "rgba(255,255,255,.035)";
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if ((x+y)%2) ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
  drawAmbient(ts);
  drawBonus(ts);

  // food, pulsing
  const pulse = 1 + Math.sin(ts / 180) * 0.12;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  drawHeart(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL * 0.4 * pulse, food.c);

  // body: tail to head
  const L = snake.length;
  for (let i = L - 1; i >= 0; i--) {
    const p = seg(i), r = radius(i), color = "hsl(" + (350 - 50*i/L) + ",85%,66%)";
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineCap = "round"; ctx.lineWidth = r * 2;
    if (i < L - 1) {
      const q = seg(i + 1);
      if (Math.abs(p.x - q.x) < CELL * 1.5 && Math.abs(p.y - q.y) < CELL * 1.5) {
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    if (i % 3 === 1) drawHeart(p.x, p.y, r * 0.5, "rgba(255,255,255,.55)");
  }

  // head: eyes and tongue
  const hp = seg(0), [fx, fy] = DIRS[dir], px = -fy, py = fx;
  if (Math.floor(ts / 350) % 2) {
    ctx.strokeStyle = "#ff3355"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hp.x + fx*CELL*0.5, hp.y + fy*CELL*0.5);
    ctx.lineTo(hp.x + fx*CELL*0.95, hp.y + fy*CELL*0.95); ctx.stroke();
  }
  [-1, 1].forEach(s => {
    const ex = hp.x + fx*CELL*0.15 + px*s*CELL*0.22, ey = hp.y + fy*CELL*0.15 + py*s*CELL*0.22;
    ctx.fillStyle = "rgba(255,60,120,.5)"; ctx.beginPath();
    ctx.arc(hp.x - fx*CELL*0.1 + px*s*CELL*0.32, hp.y - fy*CELL*0.1 + py*s*CELL*0.32, CELL*0.12, 0, Math.PI*2); ctx.fill();   // blush
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, CELL*0.17, 0, Math.PI*2); ctx.fill();
    if (bonusSteps > 0) drawHeart(ex + fx*2, ey + fy*2, CELL*0.11, "#ff2e63");   // heart eyes during a bonus
    else { ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(ex + fx*2, ey + fy*2, CELL*0.08, 0, Math.PI*2); ctx.fill(); }
  });

  drawHeart(hp.x + px*CELL*0.32 - fx*CELL*0.28, hp.y + py*CELL*0.32 - fy*CELL*0.28, CELL*0.16, "#ffd166");   // gold heart ornament

  // sparkles and +1
  ctx.font = "14px serif";
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.025; ctx.globalAlpha = Math.max(p.life, 0); ctx.fillText(p.e, p.x, p.y); });
  floaters = floaters.filter(f => f.life > 0);
  ctx.font = "bold 18px Trebuchet MS"; ctx.fillStyle = "#ffd166";
  floaters.forEach(f => { f.y -= 0.8; f.life -= 0.02; ctx.globalAlpha = Math.max(f.life, 0); ctx.fillText(f.t, f.x, f.y); });
  ctx.globalAlpha = 1;
}

function loop(ts) {
  if (running && !paused && ts - lastStep >= stepMs) { lastStep = ts; step(); }
  draw(ts); requestAnimationFrame(loop);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  if (paused) { music.pause(); $("title").textContent = "Paused"; $("name").style.display = "none"; $("start").textContent = "Resume"; $("overlay").classList.remove("hidden"); }
  else { $("overlay").classList.add("hidden"); lastStep = performance.now(); music.play().catch(() => {}); }
}

$("start").addEventListener("click", () => { if (paused) togglePause(); else start(); });
$("name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
$("mute").addEventListener("click", e => { muted = !muted; music.muted = muted; e.target.textContent = muted ? "Sound off" : "Sound on"; e.target.setAttribute("aria-pressed", muted); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const map = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right", w:"up", s:"down", a:"left", d:"right" };
  if (map[e.key]) { e.preventDefault(); turn(map[e.key]); }
  else if (e.key === " ") { e.preventDefault(); togglePause(); }
});
document.querySelectorAll("[data-dir]").forEach(b => b.addEventListener("click", () => turn(b.dataset.dir)));
let sx, sy;
canvas.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
canvas.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
}, { passive:true });

reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
